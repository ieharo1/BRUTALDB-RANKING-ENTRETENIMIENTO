services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: brutaldb
      POSTGRES_USER: brutaldb
      POSTGRES_PASSWORD: brutaldb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brutaldb -d brutaldb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: brutaldb
      POSTGRES_USER: brutaldb
      POSTGRES_PASSWORD: brutaldb
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
